<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="贪吃蛇竞赛 Web 游戏" />
  <meta name="workflow-marker" content="snake-loop-competition" />
  <title>贪吃蛇竞赛</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <div id="app">
    <header class="hud">
      <h1 class="title">贪吃蛇竞赛</h1>
      <div class="stats">
        <div class="stat"><span class="label">分数</span><span id="score" class="value">0</span></div>
        <div class="stat"><span class="label">等级</span><span id="level" class="value">1</span></div>
        <div class="stat"><span class="label">最高分</span><span id="highScore" class="value">0</span></div>
      </div>
      <div class="controls">
        <button id="pauseBtn" class="btn" type="button">暂停</button>
        <button id="restartBtn" class="btn" type="button">重新开始</button>
      </div>
    </header>

    <main class="stage">
      <canvas id="gameCanvas" width="480" height="480" aria-label="贪吃蛇游戏画布"></canvas>

      <section id="menuScreen" class="overlay">
        <div class="panel">
          <h2>贪吃蛇竞赛</h2>
          <p>用方向键 / WASD 控制蛇移动，吃食物得分，撞墙或撞自己结束。</p>
          <p>空格暂停，R 重新开始。</p>
          <button id="playBtn" class="btn primary" type="button">开始游戏</button>
        </div>
      </section>

      <div id="gameOverModal" class="overlay hidden" role="dialog" aria-modal="true" aria-label="游戏结束">
        <div class="panel">
          <h2>游戏结束</h2>
          <div class="result-row">
            <span>得分 <strong id="finalScore">0</strong></span>
            <span>等级 <strong id="finalLevel">1</strong></span>
          </div>
          <p id="recordBadge" class="record hidden">新纪录！</p>
          <button id="playAgainBtn" class="btn primary" type="button">再玩一次</button>
        </div>
      </div>
    </main>

    <footer class="footer">snake-loop-competition · 工作流 d138728f</footer>
  </div>
</body>
</html>
